<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>Página no encontrada · SOSmoto</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #F5F5F7;
  margin: 0;
  padding: 32px 16px;
  display: flex;
  justify-content: center;
}
.card {
  width: 100%;
  max-width: 480px;
  background: #FFFFFF;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(26,26,46,0.12);
}
.brand-bar {
  padding: 14px 20px;
  text-align: center;
  border-bottom: 1px solid #E5E5EA;
}
.brand {
  color: #FF6B00;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.2px;
  text-decoration: none;
}
.content {
  padding: 40px 24px;
  text-align: center;
}
.icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  margin-bottom: 16px;
}
h1 {
  font-size: 18px;
  color: #1A1A2E;
  margin: 0 0 8px;
}
p {
  font-size: 14px;
  color: #6B6B7B;
  line-height: 20px;
  margin: 0 0 24px;
}
.button {
  display: inline-block;
  background: #FF6B00;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 24px;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand-bar"><a class="brand" href="/">SOSmoto</a></div>
  <div class="content">
    <img src="/favicon.png" alt="SOSmoto" class="icon" />
    <h1>No encontramos esta página</h1>
    <p>El enlace puede estar mal escrito o ya no existir.</p>
    <a class="button" href="/">Ir al inicio</a>
  </div>
</div>
</body>
</html>
